name: Publish verified Keyfer Bridge update
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows verification run ID
        required: true
      commit_sha:
        description: Full tested source commit SHA
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source and successful Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName > run.json
          jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .headSha == $sha and .workflowName == "Keyfer adapter checks"' run.json
      - uses: actions/download-artifact@v4
        with:
          name: ACAI2-Rynth-Keyfer-Windows
          path: verified
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Package Bridge-only Luna trial
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test -f verified/Bridge/ACAI2.Bridge.exe
          test -f verified/Start-Keyfer-Luna.cmd
          test -f verified/KEYFER-LUNA-UPDATE.md
          mkdir package
          cp -a verified/Bridge package/Bridge
          cp verified/Start-Keyfer-Luna.cmd verified/KEYFER-LUNA-UPDATE.md package/
          cp verified/THIRD-PARTY-NOTICES.md verified/RynthCore-LICENSE.txt package/
          cp -a verified/THIRD-PARTY-NOTICES package/
          test ! -e package/ACAI2.Rynth.Plugin.dll
          test ! -e package/Bridge/Data
          test ! -e package/Bridge/Config
          if find package -iname '.env' -o -iname 'keyfer.json' -o -iname '*.sqlite' -o -iname '*.jsonl' | grep -q .; then
            echo 'Unexpected runtime data in package'; exit 1
          fi
          zip_name='ACAI2-Keyfer-Bridge-v0.20.1-Windows.zip'
          (cd package && zip -qr "../$zip_name" .)
          sha256sum "$zip_name" > "$zip_name.sha256"
          cat > notes.md <<NOTES
          Bridge v0.20.1 adds safe HTTP status/error-code diagnostics and defaults Keyfer to GPT-6 Luna. Chat/wiki, memory review and arena commentary use compatible reasoning settings. The startup header displays the selected model. Behavior, moderation, memory paths and action permissions are unchanged.

          **Bridge-only trial update.** Keep the installed Keyfer client plugin. Stop the old Bridge, back up its Bridge folder and copy the ZIP's Bridge folder over that existing folder. Preserve your API key, Data, Knowledge, Config and custom startup settings. Start normally and confirm the header says gpt-6-luna. An optional Start-Keyfer-Luna.cmd selects Luna for that launch only. See KEYFER-LUNA-UPDATE.md inside.

          Windows self-contained x64 build from $SOURCE_SHA. Controlled fake-provider tests passed; no live AI requests or player conversations were used in tests. Live personality, latency and account model access remain to be checked. Game and Discord continue sharing the same listener.

          No Rynth engine, RynthAi DLL, Combat, Threads, Scrollwork, Marae or Keyfer client plugin is included or replaced.
          NOTES
          gh release create keyfer-bridge-v0.20.1 "$zip_name" "$zip_name.sha256" --prerelease --target "$SOURCE_SHA" --title 'Keyfer Bridge v0.20.1 — Luna diagnostics' --notes-file notes.md
