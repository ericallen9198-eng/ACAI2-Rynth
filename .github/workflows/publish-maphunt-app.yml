name: Publish standalone MapHunt app beta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthSuite
          ref: 1e7c9924c816d8b2c29f27eda95b8ab7e5239870
          path: RynthSuite
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthCore
          ref: fc246c0a4277fbc68207302e6d7ce22a16715fa6
          path: RynthCore
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply version-matched NPC and read-only recovery compatibility
        shell: pwsh
        run: |
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-2026.11.19.1/mission.patch"
          if ($LASTEXITCODE) { throw 'Patch mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-2026.11.19.1/mission.patch"
          if ($LASTEXITCODE) { throw 'Patch application failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.5/navigation.patch"
          if ($LASTEXITCODE) { throw 'Navigation extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.5/navigation.patch"
          if ($LASTEXITCODE) { throw 'Navigation extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.6/mesh.patch"
          if ($LASTEXITCODE) { throw 'Mesh extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.6/mesh.patch"
          if ($LASTEXITCODE) { throw 'Mesh extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.8/stride.patch"
          if ($LASTEXITCODE) { throw 'Stride extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.8/stride.patch"
          if ($LASTEXITCODE) { throw 'Stride extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.9/ranges.patch"
          if ($LASTEXITCODE) { throw 'Travel ranges extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.9/ranges.patch"
          if ($LASTEXITCODE) { throw 'Travel ranges extension failed' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.10/parser-compat.patch"
          if ($LASTEXITCODE) { throw 'Currency helper patch mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.12/npc-approach.patch"
          if ($LASTEXITCODE) { throw 'NPC interaction approach patch mismatch' }
          Copy-Item work/patches/marae-mission-v1.9/MaraeMapWalkMath.cs RynthSuite/Plugins/RynthCore.Plugin.RynthAi/Meta/
          Copy-Item work/patches/marae-mission-2026.11.19.1/NpcReplyGate.cs RynthSuite/Plugins/RynthCore.Plugin.RynthAi/
      - name: Publish standalone app and test its controller
        shell: pwsh
        run: |
          & work/scripts/Publish-MapHunt.ps1 -ExpressionLog "$env:RUNNER_TEMP/app-expressions.json"
          if ($LASTEXITCODE) { throw 'App build/checks failed' }
          python work/tools/ACAI2.MapHunt/check_script_abi.py "$env:GITHUB_WORKSPACE/RynthSuite/Plugins/Shared/RynthAiScriptApi.cs"
          if ($LASTEXITCODE) { throw 'Script ABI mismatch' }
          dotnet run --project work/tools/ACAI2.MapHunt "-p:RynthSuiteRoot=$env:GITHUB_WORKSPACE/RynthSuite" -- "$env:GITHUB_WORKSPACE/work/metas/maphunt-app/MapHunt App.af" "$env:RUNNER_TEMP/app-rules.json"
          if ($LASTEXITCODE) { throw 'App AF parser failed' }
          python work/tools/ACAI2.MapHunt/test_meta.py "$env:RUNNER_TEMP/app-rules.json"
          if ($LASTEXITCODE) { throw 'App treasure scenarios failed' }
      - name: Audit the resource and controller with the actual expression engine
        shell: pwsh
        run: |
          dotnet build RynthSuite/Plugins/RynthCore.Plugin.RynthAi/RynthCore.Plugin.RynthAi.csproj -c Release -p:PublishAot=false -p:NativeLib= -p:SelfContained=false -p:RuntimeIdentifier=win-x86 -p:PlatformTarget=x86 -p:Version=2026.11.19.1 -p:InformationalVersion=2026.11.19.1+acai2-marae-mission.7 -p:RynthPluginSharedSdk=true
          if ($LASTEXITCODE) { throw 'Actual engine build failed' }
          dotnet publish work/tools/ACAI2.ExpressionAudit -c Release -r win-x86 --self-contained true -o "$env:RUNNER_TEMP/expression-audit"
          if ($LASTEXITCODE) { throw 'Audit tool build failed' }
          & "$env:RUNNER_TEMP/expression-audit/ACAI2.ExpressionAudit.exe" "$env:GITHUB_WORKSPACE/RynthSuite/Plugins/RynthCore.Plugin.RynthAi/bin/Release/net10.0-windows/win-x86/RynthCore.Plugin.RynthAi.dll" "$env:RUNNER_TEMP/app-rules.json" "$env:GITHUB_WORKSPACE/RynthSuite/Plugins/RynthCore.Plugin.RynthAi/Meta/ExpressionEngine.cs" "$env:RUNNER_TEMP/app-expressions.json"
          if ($LASTEXITCODE) { throw 'Actual parser audit failed' }
      - name: Include unchanged reviewed support and test its installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download marae-lassel-mission-v1.14 --repo '${{ github.repository }}' --pattern Marae-Lassel-Mission-v1.14.zip --dir "$env:RUNNER_TEMP/support"
          if ($LASTEXITCODE) { throw 'Support download failed' }
          Expand-Archive "$env:RUNNER_TEMP/support/Marae-Lassel-Mission-v1.14.zip" "$env:RUNNER_TEMP/support/extracted"
          $dll="$env:RUNNER_TEMP/support/extracted/RynthCore.Plugin.RynthAi.dll"
          if ((Get-FileHash $dll).Hash -ne '9b29173de8a04cba9ec6be3b86006f60923eef75de0949b947e2e6ea4804d9ed') { throw 'Support checksum mismatch' }
          Copy-Item $dll work/artifacts/maphunt-app/Compatibility/
          Copy-Item RynthSuite/LICENSE work/artifacts/maphunt-app/Compatibility/RynthSuite-LICENSE.txt
          & work/tools/ACAI2.MapHunt/Test-AppSupport.ps1 -Package "$env:GITHUB_WORKSPACE/work/artifacts/maphunt-app"
          if ($LASTEXITCODE) { throw 'Support installer checks failed' }
      - name: Verify and publish the Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg="$env:GITHUB_WORKSPACE/work/artifacts/maphunt-app"
          if (Test-Path "$pkg/cimgui.dll") { throw 'Second native ImGui runtime must not ship' }
          if (Test-Path "$pkg/ImGui.NET.dll") { throw 'Engine-owned binding must not ship' }
          $dll="$pkg/ACAI2.Rynth.MapHunt.Plugin.dll"
          if (-not [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($dll)).Contains('RYNTH_PLUGIN_MANIFEST')) { throw 'Native Windows manifest missing' }
          Compress-Archive -Path "$pkg/*" -DestinationPath ACAI2-MapHunt-App-v0.1.0-Windows.zip
          $zip='ACAI2-MapHunt-App-v0.1.0-Windows.zip'
          $hash=(Get-FileHash $zip).Hash.ToLowerInvariant()
          "$hash  $zip"|Set-Content "$zip.sha256" -Encoding ascii
          gh release create maphunt-app-v0.1.0 $zip "$zip.sha256" --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'MapHunt app v0.1.0 — standalone Rynth plugin beta' --notes-file work/docs/MAPHUNT-APP-SETUP.md --latest=false
          if ($LASTEXITCODE) { throw 'App release publication failed' }
