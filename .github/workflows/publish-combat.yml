name: Publish verified Combat package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows verification run ID
        required: true
      version:
        description: Package version (e.g. 0.1.7)
        required: true
        default: '0.1.7'
      commit_sha:
        description: Full tested source commit SHA
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the requested build succeeded for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json conclusion,headSha > run.json
          jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .headSha == $sha' run.json
      - name: Download Windows package from the verified build
        uses: actions/download-artifact@v4
        with:
          name: ACAI2-Combat-Windows
          path: package
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package/ACAI2.Rynth.Combat.Plugin.dll
          test -f package/COMBAT-SETUP.md
          test -f package/COMBAT-PREVIEW.html
          test -f package/combat-design.svg
          test -f package/notice-scales.svg
          test ! -e package/cimgui.dll
          test ! -e package/ImGui.NET.dll
          test ! -e package/ACAI2.Rynth.Combat.Future.dll
          test ! -e package/ACAI2.Rynth.Threads.Plugin.dll
          test ! -e package/ACAI2.Rynth.Plugin.dll
          zip_name="ACAI2-Combat-v${PACKAGE_VERSION}-Windows.zip"
          tag="combat-v${PACKAGE_VERSION}"
          cp package/COMBAT-PREVIEW.html "$RUNNER_TEMP/COMBAT-PREVIEW.html"
          cp package/combat-design.svg "$RUNNER_TEMP/combat-design.svg"
          cd package
          zip -qr "$RUNNER_TEMP/$zip_name" .
          cd "$RUNNER_TEMP"
          sha256sum "$zip_name" > "$zip_name.sha256"
          cat > release-notes.md <<NOTES
          v0.1.7 removes the solid backings from floating vuln/Imperil and Kinetic Ready notices, keeping open colored accents, block lettering and glyph outlines. Adds saved per-character Buffs/Debuffs/Skills scale sliders that scale each group's lettering, captions and graphics together. Kinetic Ready settles into a smaller READY cue. Normal damage, crits and healing keep their existing controls. Includes an HTML group-size preview and notice-scales.svg comparison generated from shared vector geometry. Per-pack DPS and Kinetic/Reckless statistics are unchanged. Built from $SOURCE_SHA using the genuine Rynth SDK and Windows manifest tooling.

          Requires managed CoreCLR RynthCore API 92+ and matching engine ImGui bindings. No Bridge, Keyfer, Threads or RynthAi dependency; no attacks, casts, bank/vendor commands or debuff renderer. Disable RynthVision floating numbers separately with /rv plates numbers off; keep its debuff icons.

          Extract all DLLs together and follow COMBAT-SETUP.md. The floating anchor is adjustable fixed-screen positioning in this first build. Automatic camera-follow awaits a supported projection-frame interface. Ordinary combat chat is never retained; only compact totals and bounded server death notices are saved. Automated checks use synthetic events; live UI validation remains. Includes a preview that does not affect real statistics.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_name" "$zip_name.sha256" COMBAT-PREVIEW.html combat-design.svg --clobber
          else
            gh release create "$tag" "$zip_name" "$zip_name.sha256" COMBAT-PREVIEW.html combat-design.svg --target "$SOURCE_SHA" --title "Combat for Rynth v$PACKAGE_VERSION — Windows package" --notes-file release-notes.md
          fi
