name: Publish native toolbar editions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build toolbar and existing app checks
        shell: pwsh
        run: |
          python -m pip install reportlab==4.4.9
          dotnet run --project tests/ACAI2.Toolbar.Tests -c Release
          if($LASTEXITCODE){throw 'Genuine UI manifest / visibility tests failed'}
          & scripts/Publish-Scrolls.ps1
          if($LASTEXITCODE){throw 'Scrollwork publish failed'}
          & scripts/Publish-Threads.ps1
          if($LASTEXITCODE){throw 'Threads publish failed'}
          & scripts/Publish-Marae.ps1
          if($LASTEXITCODE){throw 'Marae publish failed'}
      - name: Exercise actual Windows metadata and embed exports
        shell: pwsh
        run: |
          dotnet publish tools/ACAI2.ToolbarSmoke -c Release -r win-x86 --self-contained true -o "$env:RUNNER_TEMP/toolbar-smoke"
          if($LASTEXITCODE){throw 'Toolbar smoke build failed'}
          $cases=@(
            @('artifacts/scrolls/Support/Plugin/ACAI2.Rynth.Scrolls.Plugin.dll','Scrollwork'),
            @('artifacts/threads-managed/ACAI2.Rynth.Threads.Plugin.dll','Threads'),
            @('artifacts/marae-stock/Support/Plugin/ACAI2.Rynth.Marae.Plugin.dll','ACAI2 Marae'))
          foreach($case in $cases){
            & "$env:RUNNER_TEMP/toolbar-smoke/ACAI2.ToolbarSmoke.exe" (Join-Path $env:GITHUB_WORKSPACE $case[0]) $case[1]
            if($LASTEXITCODE){throw "Actual toolbar exports failed: $($case[1])"}
            $folder=Split-Path $case[0] -Parent
            if(Test-Path (Join-Path $folder 'cimgui.dll')){throw 'Must use engine ImGui'}
            if(Test-Path (Join-Path $folder 'ImGui.NET.dll')){throw 'Must use engine bindings'}
          }
          & tools/ACAI2.ScrollsSmoke/Test-Installer.ps1 -Package "$env:GITHUB_WORKSPACE/artifacts/scrolls"
          if($LASTEXITCODE){throw 'Scroll installer failed'}
          & tools/ACAI2.ToolbarSmoke/Test-ThreadInstaller.ps1 -Package "$env:GITHUB_WORKSPACE/artifacts/threads-managed"
          if($LASTEXITCODE){throw 'Thread installer failed'}
          & tools/ACAI2.MaraeStock/Test-Installer.ps1 -Package "$env:GITHUB_WORKSPACE/artifacts/marae-stock"
          if($LASTEXITCODE){throw 'Marae installer failed'}
      - name: Publish the three standalone packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages=@(
            @{Folder='scrolls';Zip='ACAI2-Scrollwork-v0.1.3-Windows.zip';Tag='scrolls-v0.1.3';Title='Scrollwork v0.1.3 — native scroll toolbar icon';Notes='docs/SCROLLS-SETUP.md'},
            @{Folder='threads-managed';Zip='ACAI2-Threads-v0.1.7-Windows.zip';Tag='threads-v0.1.7';Title='Threads v0.1.7 — native toolbar panel';Notes='docs/THREADS-SETUP.md'},
            @{Folder='marae-stock';Zip='ACAI2-Marae-App-v1.18.0-Windows.zip';Tag='marae-stock-app-v1.18.0';Title='Marae Lassel v1.18.0 — native map toolbar panel';Notes='docs/MARAE-APP-SETUP.md'})
          foreach($p in $packages){
            Compress-Archive -Path "artifacts/$($p.Folder)/*" -DestinationPath $p.Zip
            $hash=(Get-FileHash $p.Zip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($p.Zip)" | Set-Content "$($p.Zip).sha256" -Encoding ascii
            gh release create $p.Tag $p.Zip "$($p.Zip).sha256" --repo '${{ github.repository }}' --target '${{ github.sha }}' --title $p.Title --notes-file $p.Notes --prerelease --latest=false
            if($LASTEXITCODE){throw "Release failed: $($p.Tag)"}
          }
          Copy-Item artifacts/marae-stock/Marae-Quick-Start.pdf Marae-Quick-Start-v1.18.0.pdf
          gh release upload marae-stock-app-v1.18.0 Marae-Quick-Start-v1.18.0.pdf --repo '${{ github.repository }}'
          if($LASTEXITCODE){throw 'Marae PDF upload failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: Native-Toolbar-App-Packages
          path: |
            *.zip
            *.sha256
            Marae-Quick-Start-v1.18.0.pdf
