name: Standalone Combat app checks
on:
  push:
    paths: ['src/ACAI2.Rynth.Combat.*/**', 'tests/ACAI2.Rynth.Combat.Tests/**', 'tools/ACAI2.Combat.DesignPreview/**', 'scripts/*Combat*', 'scripts/test-combat.sh', 'docs/COMBAT-SETUP.md', '.github/workflows/combat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux Combat build and checks
        if: runner.os == 'Linux'
        run: scripts/test-combat.sh
      - name: Windows Combat publish and checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/Publish-Combat.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ACAI2-Combat-Windows
          path: artifacts/combat-managed/
