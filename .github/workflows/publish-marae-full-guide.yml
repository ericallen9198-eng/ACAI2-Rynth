name: Publish Marae full player guide
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools and embedded fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install reportlab==4.4.9 pymupdf==1.26.7
      - name: Build the complete branded tutorial
        run: python tools/ACAI2.MaraeStock/build_full_guide.py --output artifacts/full-guide/Marae-Lassel-Full-Guide-v1.17.0.pdf
      - name: Check pages, logo, links and copyable commands
        run: |
          python - <<'PY'
          import fitz,re
          from pathlib import Path
          doc=fitz.open('artifacts/full-guide/Marae-Lassel-Full-Guide-v1.17.0.pdf')
          assert len(doc)==8
          assert len(doc[0].get_images())==1
          assert sum(len(p.get_links()) for p in doc)==5
          text=''.join(''.join(p.get_text().split()) for p in doc)
          source=Path('docs/MARAE-FULL-GUIDE.md').read_text()
          for command in re.findall(r'```\n(.*?)\n```',source,re.S):
              assert ''.join(command.split()) in text,command
          for page in doc:
              for block in page.get_text('blocks'):
                  assert block[0]>=35 and block[2]<=575 and block[1]>=10 and block[3]<=780
          print('Full tutorial PDF checks passed.')
          PY
      - name: Add the full PDF to the existing app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload marae-stock-app-v1.17.0 artifacts/full-guide/Marae-Lassel-Full-Guide-v1.17.0.pdf --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Marae-Lassel-Full-Guide-v1.17.0
          path: artifacts/full-guide/Marae-Lassel-Full-Guide-v1.17.0.pdf
