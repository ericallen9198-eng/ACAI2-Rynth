name: Verify and publish no-salvage loot profile
on:
  workflow_dispatch:
    inputs:
      original_gzip_base64:
        description: Exact working original UTL, gzipped and base64-encoded
        required: true
      profile_gzip_base64:
        description: Gzipped UTL profile (base64 data, not code)
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthSuite
          ref: 708a4dafeaa2ac0a4392237cd008db05142cd02c
          path: reviewed-rynth-suite
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Decode profile data
        env:
          ORIGINAL_DATA: ${{ inputs.original_gzip_base64 }}
          PROFILE_DATA: ${{ inputs.profile_gzip_base64 }}
        run: |
          python - <<'PY'
          import os,base64,gzip,io
          for key,path in [('ORIGINAL_DATA','original.utl'),('PROFILE_DATA','Keyfer-Mule-NoSalvage.utl')]:
              data=base64.b64decode(os.environ[key],validate=True)
              with gzip.GzipFile(fileobj=io.BytesIO(data)) as f:
                  text=f.read(2*1024*1024+1)
              assert len(text)<=2*1024*1024 and text.startswith(b'UTL\n1\n')
              open(path,'wb').write(text)
          PY
      - name: Verify with the genuine RynthSuite parser
        run: dotnet run --project tools/ACAI2.MuleProfile -p:LootSdkRoot="$GITHUB_WORKSPACE/reviewed-rynth-suite/Shared/RynthCore.LootSdk" -- --compare original.utl Keyfer-Mule-NoSalvage.utl
      - name: Publish loot file only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum Keyfer-Mule-NoSalvage.utl > Keyfer-Mule-NoSalvage.utl.sha256
          if gh release view keyfer-loot-nosalvage-v2 >/dev/null 2>&1; then
            gh release upload keyfer-loot-nosalvage-v2 Keyfer-Mule-NoSalvage.utl Keyfer-Mule-NoSalvage.utl.sha256 --clobber
          else
            gh release create keyfer-loot-nosalvage-v2 Keyfer-Mule-NoSalvage.utl Keyfer-Mule-NoSalvage.utl.sha256 --target "$GITHUB_SHA" --title "Keyfer chest loot - no salvage" --notes "Loot profile only. Salvage rules removed and combining disabled; EVERY non-salvage rule and condition preserved exactly from the supplied working original. No added eligibility filters. Verified with the genuine RynthSuite LootSdk. No character settings, installer, plugin, behavior or Bridge changes. Copy the UTL into RynthAi/LootProfiles and select it under LOOT." --latest=false
          fi
