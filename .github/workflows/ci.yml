name: Read-only pilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux compile and controlled tests
        if: runner.os == 'Linux'
        run: scripts/test.sh
      - name: Windows publish and controlled tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ACAI2-Rynth-readonly-pilot
          path: artifacts/plugin-managed/
