name: Publish verified Keyfer package
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package from the verified v0.3.0 build
        uses: actions/download-artifact@v4
        with:
          name: ACAI2-Rynth-Keyfer-Windows
          path: package
          run-id: 43420547592
          github-token: ${{ github.token }}
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package/ACAI2.Rynth.Plugin.dll
          test -f package/keyfer.example.json
          test ! -e package/ImGui.NET.dll
          test ! -e package/ACAI2.Rynth.Combat.Future.dll
          cd package
          zip -qr "$RUNNER_TEMP/ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip" .
          cd "$RUNNER_TEMP"
          sha256sum ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip > ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip.sha256
          cat > release-notes.md <<'NOTES'
          Keyfer-only Rynth adapter, built and published on Windows from source commit 3c67ea6a0f3307c6f565e468ef08ace292e988c3. All 98 controlled checks passed. No live game/AI calls were used in testing; in-game verification remains.

          Download **ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip** below. It contains the compiled plugin, dependencies, example configuration and setup instructions. No source rebuild is needed.

          Requires RynthCore CoreCLR managed x86 plugin support, API 92+. Engine release 2026.11.12.1 is API 97. Keep your existing ACAI2 Bridge v0.17 and its data/configuration. Combat rendering and tracking are excluded.

          Extract the entire ZIP together. Add ACAI2.Rynth.Plugin.dll through RynthCore's Plugins tab. Copy keyfer.example.json to %LOCALAPPDATA%\ACAI2-Rynth\keyfer.json. Stop the old Keyfer responder before enabling this one. See KEYFER-SETUP.md inside the ZIP for complete instructions. Automatic treasure payments default disabled.
          NOTES
          if gh release view keyfer-v0.3.0 >/dev/null 2>&1; then
            gh release upload keyfer-v0.3.0 ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip.sha256 --clobber
          else
            gh release create keyfer-v0.3.0 ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip ACAI2-Rynth-Keyfer-v0.3.0-Windows.zip.sha256 --target 3c67ea6a0f3307c6f565e468ef08ace292e988c3 --title "Keyfer for Rynth v0.3.0 — Windows package" --notes-file release-notes.md
          fi
