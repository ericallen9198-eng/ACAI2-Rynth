name: Publish verified Keyfer package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows verification run ID
        required: true
      version:
        description: Package version (e.g. 0.3.1)
        required: true
        default: '0.3.1'
      commit_sha:
        description: Full tested source commit SHA
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the requested build succeeded for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json conclusion,headSha > run.json
          jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .headSha == $sha' run.json
      - name: Download Windows package from the verified build
        uses: actions/download-artifact@v4
        with:
          name: ACAI2-Rynth-Keyfer-Windows
          path: package
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package/ACAI2.Rynth.Plugin.dll
          test -f package/keyfer.example.json
          test ! -e package/ImGui.NET.dll
          test ! -e package/ACAI2.Rynth.Combat.Future.dll
          zip_name="ACAI2-Rynth-Keyfer-v${PACKAGE_VERSION}-Windows.zip"
          tag="keyfer-v${PACKAGE_VERSION}"
          cd package
          zip -qr "$RUNNER_TEMP/$zip_name" .
          cd "$RUNNER_TEMP"
          sha256sum "$zip_name" > "$zip_name.sha256"
          cat > release-notes.md <<NOTES
          Keyfer-only Windows package, built and tested from source commit $SOURCE_SHA. No live game/AI calls were used in testing; in-game verification remains.

          Download **$zip_name** below. It includes the compiled plugin, dependencies, example configuration and setup guide; no source rebuild is required.

          v0.3.1 fixes the Bridge MissingMethodException under Rynth's isolated JSON loading. This failure was reproduced with a Rynth-style collectible assembly context and now has a registration/tell-delivery regression check.

          Requires RynthCore CoreCLR managed x86 support, API 92+. Keep the existing Bridge v0.17 and keyfer.json. Combat is excluded. Close the game before replacing all package DLLs together; do not overwrite your existing keyfer.json with the example. See KEYFER-SETUP.md in the ZIP.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_name" "$zip_name.sha256" --clobber
          else
            gh release create "$tag" "$zip_name" "$zip_name.sha256" --target "$SOURCE_SHA" --title "Keyfer for Rynth v$PACKAGE_VERSION — Windows package" --notes-file release-notes.md
          fi
