name: Verify and publish Plateau treasure meta
on:
  workflow_dispatch:
    inputs:
      original_loot_gzip_base64:
        description: Supplied loot profile, gzip and base64 encoded (data only)
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthSuite
          ref: 5e70799b1c83d3cc1f2b06e06a274dd3f7449c82
          path: reviewed-rynth-suite
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Decode supplied loot profile as data
        env:
          LOOT_DATA: ${{ inputs.original_loot_gzip_base64 }}
        run: |
          python - <<'PY'
          import os,base64,gzip,io,pathlib
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(os.environ['LOOT_DATA'],validate=True))) as f:
              data=f.read(1024*1024+1)
          assert len(data)<=1024*1024 and data.replace(b'\r\n',b'\n').startswith(b'UTL\n1\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'original-loot.utl').write_bytes(data)
          PY
      - name: Prepare currency profile with genuine LootSdk
        run: dotnet run --project tools/ACAI2.PlateauMeta -p:RynthSuiteRoot="$GITHUB_WORKSPACE/reviewed-rynth-suite" -- --prepare-loot "$RUNNER_TEMP/original-loot.utl" metas/plateau-treasure-verified-v3/DW_Farm_Peas_Rares_Custom-Currency.utl
      - name: Check AF, MET, NPC handshakes, navs and currency rules
        run: dotnet run --project tools/ACAI2.PlateauMeta -p:RynthSuiteRoot="$GITHUB_WORKSPACE/reviewed-rynth-suite" -- metas/plateau-treasure-verified-v3 "$RUNNER_TEMP/original-loot.utl" "$RUNNER_TEMP/plateau-rules.json"
      - name: Simulate cache pickup, optional notes, corpse payout and death branches
        run: python tools/ACAI2.PlateauMeta/test_cache.py "$RUNNER_TEMP/plateau-rules.json"
      - name: Package and publish meta and loot files only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd metas/plateau-treasure-verified-v3
          sha256sum -c SHA256SUMS.txt
          zip -qr "$RUNNER_TEMP/Plateau-Treasure-Verified-v3.1.zip" . -x .gitignore
          cd "$RUNNER_TEMP"
          sha256sum Plateau-Treasure-Verified-v3.1.zip > Plateau-Treasure-Verified-v3.1.zip.sha256
          cat > notes.md <<NOTES
          Plateau Treasure Verified v3.1 fixes camp startup readiness by replacing portal-expression/optional max-health checks with native cell conditions, current HP and settle timing. Timeout diagnostics print actual cell/HP. It automatically continues after death: keeps the macro running, waits for natural respawn/health/portal readiness, clears interrupted pickup/map state without crediting a reward, and resumes the previous hunting region. It uses the existing camp lifestone or recorded town-to-camp approach without issuing another /ls after death. Startup also checks the /ls landing before choosing a route. An interrupted initial NPC sequence is reverified. Disables competing native death recall/corpse travel/outdoor-hunt recovery at startup; see README for exact UI locations. Non-death errors still stop with a clear message.

          Retains v2 explicit optional currency pickup and the unchanged 52-rule Currency loot profile. No plugin or Bridge update. Includes AF/MET, 19 navs and the loot profile. Genuine pinned parsers, AF/MET equivalence, 177 meta/nav checks and 71 cache/death simulations passed; no live game actions were executed during verification. Source: $GITHUB_SHA.

          NOTES
          tag=plateau-treasure-verified-v3.1.0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Plateau-Treasure-Verified-v3.1.zip Plateau-Treasure-Verified-v3.1.zip.sha256 --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" Plateau-Treasure-Verified-v3.1.zip Plateau-Treasure-Verified-v3.1.zip.sha256 --target "$GITHUB_SHA" --title "Plateau Treasure v3.1 - camp startup compatibility fix" --notes-file notes.md --latest=false
          fi
