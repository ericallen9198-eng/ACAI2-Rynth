name: Publish Marae bound cache cycling fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthSuite
          ref: 1e7c9924c816d8b2c29f27eda95b8ab7e5239870
          path: RynthSuite
      - uses: actions/checkout@v4
        with:
          repository: tombohar/RynthCore
          ref: fc246c0a4277fbc68207302e6d7ce22a16715fa6
          path: RynthCore
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply version-matched NPC and read-only recovery compatibility
        shell: pwsh
        run: |
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-2026.11.19.1/mission.patch"
          if ($LASTEXITCODE) { throw 'Patch mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-2026.11.19.1/mission.patch"
          if ($LASTEXITCODE) { throw 'Patch application failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.5/navigation.patch"
          if ($LASTEXITCODE) { throw 'Navigation extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.5/navigation.patch"
          if ($LASTEXITCODE) { throw 'Navigation extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.6/mesh.patch"
          if ($LASTEXITCODE) { throw 'Mesh extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.6/mesh.patch"
          if ($LASTEXITCODE) { throw 'Mesh extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.8/stride.patch"
          if ($LASTEXITCODE) { throw 'Stride extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.8/stride.patch"
          if ($LASTEXITCODE) { throw 'Stride extension failed' }
          git -C RynthSuite apply --check "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.9/ranges.patch"
          if ($LASTEXITCODE) { throw 'Travel ranges extension mismatch' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.9/ranges.patch"
          if ($LASTEXITCODE) { throw 'Travel ranges extension failed' }
          git -C RynthSuite apply "$env:GITHUB_WORKSPACE/work/patches/marae-mission-v1.10/parser-compat.patch"
          if ($LASTEXITCODE) { throw 'Currency helper patch mismatch' }
          Copy-Item work/patches/marae-mission-v1.9/MaraeMapWalkMath.cs RynthSuite/Plugins/RynthCore.Plugin.RynthAi/Meta/
          Copy-Item work/patches/marae-mission-2026.11.19.1/NpcReplyGate.cs RynthSuite/Plugins/RynthCore.Plugin.RynthAi/
      - name: Build and validate embedded routes and mission graph with genuine parsers
        shell: pwsh
        run: |
          python work/tools/ACAI2.MaraeMission/build_mission.py
          if ($LASTEXITCODE) { throw 'Generation failed' }
          dotnet run --project work/tools/ACAI2.MaraeMission "-p:RynthSuiteRoot=$env:GITHUB_WORKSPACE/RynthSuite" -- "$env:GITHUB_WORKSPACE/work/metas/marae-lassel-mission/MetaFiles/Marae Lassel - Embedded.af" "$env:RUNNER_TEMP/mission-rules.json"
          if ($LASTEXITCODE) { throw 'Parser/graph checks failed' }
          python work/tools/ACAI2.MaraeMission/test_mission.py "$env:RUNNER_TEMP/mission-rules.json"
          if ($LASTEXITCODE) { throw 'Mission simulations failed' }
      - name: Test controller through genuine MoonSharp and preserve NPC behavior
        shell: pwsh
        run: |
          dotnet run --project work/tools/ACAI2.MaraeMission "-p:RynthSuiteRoot=$env:GITHUB_WORKSPACE/RynthSuite" -- --lua-test "$env:GITHUB_WORKSPACE/work/tools/ACAI2.MaraeMission/lua_setup.lua" "$env:GITHUB_WORKSPACE/work/metas/marae-lassel-mission/Scripts/MaraeLassel/index.lua" "$env:GITHUB_WORKSPACE/work/tools/ACAI2.MaraeMission/lua_checks.lua" "$env:GITHUB_WORKSPACE/work/tools/ACAI2.MaraeMission/lua_allocations.lua" "$env:RUNNER_TEMP/lua-expressions.json"
          if ($LASTEXITCODE) { throw 'Lua checks failed' }
          dotnet run --project work/tools/ACAI2.MaraeMission "-p:RynthSuiteRoot=$env:GITHUB_WORKSPACE/RynthSuite" -- --map-goal-test
          if ($LASTEXITCODE) { throw 'Map-clue geometry checks failed' }
          dotnet run --project work/tools/ACAI2.MaraeNpc.Tests "-p:RynthSuiteRoot=$env:GITHUB_WORKSPACE/RynthSuite" -- "$env:GITHUB_WORKSPACE/work/metas/marae-lassel-beta"
          if ($LASTEXITCODE) { throw 'NPC regression checks failed' }
      - name: Test all-file backup installer in Windows PowerShell 5.1
        shell: pwsh
        run: |
          & work/patches/marae-mission-v1.11/Test-Installer.ps1
      - name: Build managed x86 DLL with native Windows manifest
        shell: pwsh
        run: |
          dotnet build RynthSuite/Plugins/RynthCore.Plugin.RynthAi/RynthCore.Plugin.RynthAi.csproj -c Release -p:PublishAot=false -p:NativeLib= -p:SelfContained=false -p:RuntimeIdentifier=win-x86 -p:PlatformTarget=x86 -p:Version=2026.11.19.1 -p:InformationalVersion=2026.11.19.1+acai2-marae-mission.6 -p:RynthPluginSharedSdk=true
          if ($LASTEXITCODE) { throw 'Windows build failed' }
      - name: Audit every expression with the actual x86 engine parser without game actions
        shell: pwsh
        run: |
          dotnet publish work/tools/ACAI2.ExpressionAudit -c Release -r win-x86 --self-contained true -o "$env:RUNNER_TEMP/expression-audit"
          if ($LASTEXITCODE) { throw 'Audit tool build failed' }
          & "$env:RUNNER_TEMP/expression-audit/ACAI2.ExpressionAudit.exe" "$env:GITHUB_WORKSPACE/RynthSuite/Plugins/RynthCore.Plugin.RynthAi/bin/Release/net10.0-windows/win-x86/RynthCore.Plugin.RynthAi.dll" "$env:RUNNER_TEMP/mission-rules.json" "$env:GITHUB_WORKSPACE/RynthSuite/Plugins/RynthCore.Plugin.RynthAi/Meta/ExpressionEngine.cs" "$env:RUNNER_TEMP/lua-expressions.json"
          if ($LASTEXITCODE) { throw 'Actual expression engine audit failed' }
      - name: Package one-click installation with embedded mission
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'Marae-Mission-v1.11'
          New-Item -ItemType Directory $pkg | Out-Null
          $dll='RynthSuite/Plugins/RynthCore.Plugin.RynthAi/bin/Release/net10.0-windows/win-x86/RynthCore.Plugin.RynthAi.dll'
          Add-Type -AssemblyName System.Reflection.Metadata
          $fs=[IO.File]::OpenRead((Resolve-Path $dll));$pe=[System.Reflection.PortableExecutable.PEReader]::new($fs)
          try {
            if ($pe.PEHeaders.CoffHeader.Machine.ToString() -ne 'I386' -or (([int]$pe.PEHeaders.CorHeader.Flags -band 2) -eq 0)) { throw 'Expected x86 managed DLL' }
          } finally { $pe.Dispose();$fs.Dispose() }
          $manifest=Get-Content RynthSuite/Plugins/RynthCore.Plugin.RynthAi/obj/Release/net10.0-windows/win-x86/rynth-plugin.json -Raw|ConvertFrom-Json
          if ($manifest.minEngineApi -ne 97) { throw 'Unexpected engine API requirement' }
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $dll))
          if (-not [Text.Encoding]::Unicode.GetString($bytes).Contains('RYNTH_PLUGIN_MANIFEST')) { throw 'Windows manifest missing' }
          Copy-Item $dll $pkg
          Copy-Item RynthSuite/LICENSE (Join-Path $pkg 'RynthSuite-LICENSE.txt')
          Copy-Item work/patches/marae-mission-v1.11/Update-Mission.ps1 $pkg
          Copy-Item work/patches/marae-mission-v1.11/UPDATE-MARAE-MISSION.cmd $pkg
          Copy-Item work/patches/marae-mission-v1.11/README.md $pkg
          Copy-Item -Recurse work/metas/marae-lassel-mission (Join-Path $pkg 'Mission')
          $files=@()
          foreach($rel in @('RynthCore.Plugin.RynthAi.dll','Mission\MetaFiles\Marae Lassel - Embedded.af','Mission\Scripts\MaraeLassel\index.lua')) {
            $files+=@{Source=$rel;Sha256=(Get-FileHash (Join-Path $pkg $rel) -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{Files=$files}|ConvertTo-Json -Depth 4|Set-Content (Join-Path $pkg 'checksums.json') -Encoding UTF8
          Compress-Archive -Path "$pkg/*" -DestinationPath Marae-Lassel-Mission-v1.11.zip
          $hash=(Get-FileHash Marae-Lassel-Mission-v1.11.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Marae-Lassel-Mission-v1.11.zip"|Set-Content Marae-Lassel-Mission-v1.11.zip.sha256 -Encoding ascii
      - name: Publish tested beta download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='ericallen9198-eng/ACAI2-Rynth';$tag='marae-lassel-mission-v1.11'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Marae-Lassel-Mission-v1.11.zip Marae-Lassel-Mission-v1.11.zip.sha256 --clobber --repo $repo
          } else {
            gh release create $tag Marae-Lassel-Mission-v1.11.zip Marae-Lassel-Mission-v1.11.zip.sha256 --repo $repo --target '${{ github.sha }}' --title 'Marae mission v1.11 — cycle past unsuccessful bound caches' --notes-file work/patches/marae-mission-v1.11/README.md --latest=false
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }
